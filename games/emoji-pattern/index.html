<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emoji劲舞团</title>
    <script src="../shared/i18n-detect.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 40%, #0f0f23 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #fff;
            overflow: hidden;
            position: relative;
        }

        /* 闪屏遮罩 */
        #flashOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 0, 0, 0);
            pointer-events: none;
            z-index: 500;
            transition: background 0.15s;
        }
        #flashOverlay.flash-red {
            background: rgba(255, 0, 0, 0.25);
            animation: flashRed 0.4s ease-out;
        }
        @keyframes flashRed {
            0%   { background: rgba(255, 0, 0, 0.35); }
            100% { background: rgba(255, 0, 0, 0); }
        }

        /* ========== 游戏容器 ========== */
        #gameWrapper {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            padding: 8px 12px;
        }

        /* ========== 序列栏 ========== */
        .sequence-bar-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-bottom: 8px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.35);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .seq-label {
            font-size: 12px;
            color: #888;
            white-space: nowrap;
        }
        #sequenceBar {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        .seq-item {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            border: 2px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }
        .seq-item.active {
            border-color: #00f5ff;
            background: rgba(0, 245, 255, 0.15);
            box-shadow: 0 0 15px rgba(0, 245, 255, 0.4);
            animation: pulseGlow 1.2s infinite ease-in-out;
        }
        .seq-item.done {
            opacity: 0.35;
            transform: scale(0.85);
        }
        .seq-item.done::after {
            content: '✓';
            position: absolute;
            bottom: -2px;
            right: -2px;
            font-size: 10px;
            color: #4ade80;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        @keyframes pulseGlow {
            0%, 100% { box-shadow: 0 0 10px rgba(0, 245, 255, 0.3); transform: scale(1); }
            50%      { box-shadow: 0 0 25px rgba(0, 245, 255, 0.6); transform: scale(1.08); }
        }

        /* ========== HUD ========== */
        .hud {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }
        .hud-item {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 6px 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .hud-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .hud-value {
            font-size: 20px;
            font-weight: 700;
            margin-top: 2px;
        }
        #timerDisplay { color: #ff6b6b; }
        #timerDisplay.safe { color: #4ade80; }
        #timerDisplay.warning { color: #fbbf24; }
        #scoreDisplay { color: #00f5ff; }
        #comboDisplay {
            color: #fbbf24;
            min-height: 26px;
        }

        .hud-row2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
            padding: 0 4px;
        }
        .hud-row2-item {
            font-size: 13px;
            color: #aaa;
        }
        .hud-row2-item span {
            color: #fff;
            font-weight: 600;
        }
        #phaseLabel { color: #00f5ff; }
        #errorCount { color: #ff6b6b; }

        /* ========== 游戏矩阵 ========== */
        #gameBoard {
            display: grid;
            gap: 6px;
            flex: 0 0 auto;
            max-height: 55vh;
            min-height: 200px;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            padding: 6px;
            background: transparent;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .matrix-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            position: relative;
            aspect-ratio: 1;
            min-height: 36px;
        }
        .matrix-cell:hover {
            background: rgba(255, 255, 255, 0.12);
            transform: scale(1.05);
        }
        .matrix-cell:active {
            transform: scale(0.92);
        }

        /* ========== 动画 ========== */
        .anim-correct {
            animation: correctPop 0.3s ease-out forwards;
        }
        @keyframes correctPop {
            0%   { transform: scale(1) rotate(0deg); opacity: 1; }
            50%  { transform: scale(0.6) rotate(15deg); opacity: 0.6; }
            100% { transform: scale(0) rotate(15deg); opacity: 0; }
        }

        .anim-shake {
            animation: shake 0.4s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            15% { transform: translateX(-8px) rotate(-3deg); }
            30% { transform: translateX(8px) rotate(3deg); }
            45% { transform: translateX(-6px) rotate(-2deg); }
            60% { transform: translateX(6px) rotate(2deg); }
            75% { transform: translateX(-3px) rotate(-1deg); }
        }

        .anim-flyout {
            animation: flyOut 0.5s ease-in forwards;
        }
        @keyframes flyOut {
            0%   { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-120px) scale(0.3); opacity: 0; }
        }

        /* ========== 覆盖屏幕通用 ========== */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(10, 8, 20, 0.92);
            z-index: 100;
            padding: 30px 20px;
            text-align: center;
        }
        .hidden { display: none !important; }

        .overlay-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00f5ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .overlay-emoji {
            font-size: 72px;
            margin-bottom: 12px;
            animation: bounceEmoji 0.8s infinite alternate ease-in-out;
        }
        @keyframes bounceEmoji {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(-12px) scale(1.1); }
        }
        .overlay-subtitle {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 28px;
            line-height: 1.6;
            max-width: 340px;
        }

        .btn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            min-width: 200px;
            margin: 6px 0;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }

        .btn-primary {
            background: linear-gradient(135deg, #00f5ff 0%, #bc13fe 100%);
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }

        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* ========== 开始屏幕 ========== */
        .instructions-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
            line-height: 1.8;
            max-width: 340px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .instructions-box strong {
            color: #ccc;
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }

        .best-score-display {
            margin-top: 10px;
            font-size: 13px;
            color: #fbbf24;
        }

        /* ========== 暂停屏幕 ========== */
        #pauseScreen h2 {
            font-size: 28px;
            color: #fff;
            margin-bottom: 30px;
        }
        .pause-hint {
            color: #666;
            font-size: 12px;
            margin-top: 16px;
        }

        /* ========== 游戏结束屏幕 ========== */
        .gameover-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 24px;
            max-width: 280px;
        }
        .go-stat {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px;
        }
        .go-stat-label {
            font-size: 11px;
            color: #888;
        }
        .go-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        /* ========== 关卡完成屏幕 ========== */
        .ld-stars {
            font-size: 36px;
            margin: 12px 0 20px;
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .ld-star {
            display: inline-block;
            animation: starPop 0.4s ease-out both;
        }
        @keyframes starPop {
            0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
            60%  { transform: scale(1.3) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        .ld-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 10px 0 20px;
            max-width: 320px;
        }
        .ld-stat {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            padding: 8px;
        }
        .ld-stat-label {
            font-size: 10px;
            color: #888;
            text-transform: uppercase;
        }
        .ld-stat-value {
            font-size: 18px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        /* ========== 响应式 ========== */
        @media (max-height: 700px) {
            .overlay-emoji { font-size: 56px; }
            .overlay-title { font-size: 30px; }
            .seq-item { width: 34px; height: 34px; font-size: 18px; }
            .hud-value { font-size: 18px; }
        }
        @media (max-height: 600px) {
            .sequence-bar-wrap { padding: 5px 8px; margin-bottom: 4px; }
            .hud { margin-bottom: 4px; }
            #gameBoard { gap: 4px; border-radius: 12px; }
            .overlay-emoji { font-size: 48px; }
        }
        @media (min-width: 768px) {
            #gameWrapper {
                max-width: 480px;
                padding: 16px 20px;
            }
            #gameBoard { gap: 8px; }
            .seq-item { width: 44px; height: 44px; font-size: 24px; }
        }
    </style>
</head>
<body>
    <div id="flashOverlay"></div>

    <div id="gameWrapper">
        <!-- ========== 序列栏 ========== -->
        <div class="sequence-bar-wrap">
            <span class="seq-label" data-i18n="currentTarget">当前目标</span>
            <div id="sequenceBar"></div>
        </div>

        <!-- ========== HUD ========== -->
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label" data-i18n="timeLeft">剩余时间</div>
                <div class="hud-value" id="timerDisplay">30</div>
            </div>
            <div class="hud-item">
                <div class="hud-label" data-i18n="scoreLabel">得分</div>
                <div class="hud-value" id="scoreDisplay">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label" data-i18n="combo">连击</div>
                <div class="hud-value" id="comboDisplay"></div>
            </div>
        </div>
        <div class="hud-row2">
            <div class="hud-row2-item">Lv.<span id="levelDisplay">1</span></div>
            <div class="hud-row2-item"><span id="phaseLabel">1 / 2</span></div>
            <div class="hud-row2-item">⚠️ <span id="errorCount">0 / 3</span></div>
        </div>

        <!-- ========== 游戏矩阵 ========== -->
        <div id="gameBoard"></div>

        <!-- ========== 开始屏幕 ========== -->
        <div class="ui-overlay" id="startScreen">
            <div class="overlay-emoji">🎯</div>
            <div class="overlay-title" data-i18n="title">Emoji劲舞团</div>
            <div class="overlay-subtitle" data-i18n="subtitle">按顺序消灭Emoji，挑战你的眼力和手速！</div>
            <button class="btn btn-primary" id="startBtn" data-i18n="startGame">▶️ 开始游戏</button>
            <button class="btn btn-secondary back-arcade-btn" data-i18n="backToArcade">🏠 回到街机厅</button>
            <div class="instructions-box">
                <strong data-i18n="howToPlay">玩法说明</strong>
                <span data-i18n="instructions">
                    顶部显示目标Emoji序列<br>
                    点击矩阵中所有匹配的Emoji<br>
                    按顺序消灭完整条序列 = 过关<br>
                    连续3次错误 → 游戏结束
                </span>
            </div>
            <div class="best-score-display">
                🏆 <span data-i18n="bestLabel">历史最高</span>: <span id="startBestScore">0</span>
            </div>
        </div>

        <!-- ========== 暂停屏幕 ========== -->
        <div class="ui-overlay hidden" id="pauseScreen">
            <h2 data-i18n="gamePaused">⏸️ 游戏暂停</h2>
            <div class="btn-row">
                <button class="btn btn-success" id="resumeBtn" data-i18n="resume">▶️ 继续游戏</button>
                <button class="btn btn-danger" id="restartFromPauseBtn" data-i18n="restart">🔄 重新开始</button>
            </div>
            <button class="btn btn-secondary back-arcade-btn" data-i18n="backToArcade">🏠 回到街机厅</button>
            <div class="pause-hint" data-i18n="pauseHint">按 ESC 键也可以继续游戏</div>
        </div>

        <!-- ========== 游戏结束屏幕 ========== -->
        <div class="ui-overlay hidden" id="gameOverScreen">
            <div class="overlay-emoji">💀</div>
            <div class="overlay-title" data-i18n="gameOver">💀 游戏结束</div>
            <div class="gameover-stats">
                <div class="go-stat">
                    <div class="go-stat-label" data-i18n="scoreLabel">得分</div>
                    <div class="go-stat-value" id="finalScore">0</div>
                </div>
                <div class="go-stat">
                    <div class="go-stat-label" data-i18n="levelLabel">关卡</div>
                    <div class="go-stat-value" id="finalLevel">1</div>
                </div>
            </div>
            <div style="color:#fbbf24; font-size:14px; margin-bottom:16px;">
                🏆 <span data-i18n="bestLabel">历史最高</span>: <span id="bestScoreDisplay">0</span>
            </div>
            <button class="btn btn-primary" id="restartBtn" data-i18n="restartGame">🔄 再玩一次</button>
            <button class="btn btn-secondary back-arcade-btn" data-i18n="backToArcade">🏠 回到街机厅</button>
        </div>

        <!-- ========== 关卡完成屏幕 ========== -->
        <div class="ui-overlay hidden" id="levelDoneScreen">
            <div class="overlay-emoji">🎉</div>
            <div class="overlay-title" data-i18n="levelDoneTitle">🎉 关卡完成！</div>
            <div class="ld-stars" id="starRating"></div>
            <div class="ld-stats">
                <div class="ld-stat">
                    <div class="ld-stat-label" data-i18n="levelDoneScore">得分</div>
                    <div class="ld-stat-value ld-score">0</div>
                </div>
                <div class="ld-stat">
                    <div class="ld-stat-label" data-i18n="levelDoneTime">剩余时间</div>
                    <div class="ld-stat-value ld-time">0s</div>
                </div>
                <div class="ld-stat">
                    <div class="ld-stat-label" data-i18n="levelDoneCombo">最高连击</div>
                    <div class="ld-stat-value ld-combo">0</div>
                </div>
            </div>
            <button class="btn btn-success" id="nextLevelBtn" data-i18n="levelDoneNext">➡️ 马上进入下一关...</button>
            <button class="btn btn-secondary back-arcade-btn" data-i18n="backToArcade">🏠 回到街机厅</button>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
