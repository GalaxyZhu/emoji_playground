<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title data-i18n="title">找坏人</title>
    <script src="../shared/i18n-detect.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 40%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            width: 100%;
            max-width: 600px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .game-title { font-size: 18px; font-weight: 700; }
        .hud {
            display: flex;
            gap: 16px;
            font-size: 14px;
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 11px; color: #94a3b8; }
        .hud-value { font-size: 16px; font-weight: 700; color: #fbbf24; }
        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 20px;
        }
        .level-info {
            text-align: center;
            margin-bottom: 20px;
        }
        .level-info h2 { font-size: 24px; margin-bottom: 4px; }
        .level-info p { font-size: 13px; color: #94a3b8; }
        .grid-container {
            display: grid;
            gap: 8px;
            width: 100%;
            max-width: 600px;
            justify-content: center;
            justify-items: center;
            transition: all 0.3s ease;
        }
        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            background: rgba(255,255,255,0.08);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            aspect-ratio: 1;
            width: 100%;
            height: 100%;
            min-width: 32px;
            min-height: 32px;
        }
        .grid-cell:hover { background: rgba(255,255,255,0.15); transform: scale(1.05); }
        .grid-cell.wrong { animation: shake 0.4s ease; background: rgba(239,68,68,0.3); }
        .grid-cell.correct { animation: pop 0.4s ease; background: rgba(34,197,94,0.3); }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-8px); }
            75% { transform: translateX(8px); }
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        /* ========== 覆盖屏幕（统一 emoji-pattern 风格）========== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 20, 0.92);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 1000;
            padding: 30px 20px;
            text-align: center;
        }
        .overlay.hidden { display: none !important; }

        .overlay-emoji {
            font-size: 72px;
            margin-bottom: 12px;
            animation: bounceEmoji 0.8s infinite alternate ease-in-out;
        }
        @keyframes bounceEmoji {
            from { transform: translateY(0) scale(1); }
            to   { transform: translateY(-12px) scale(1.1); }
        }
        .overlay-title {
            font-size: 36px;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(135deg, #00f5ff, #bc13fe);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .overlay-subtitle {
            font-size: 15px;
            color: #aaa;
            margin-bottom: 28px;
            line-height: 1.6;
            max-width: 340px;
        }

        .btn {
            padding: 14px 36px;
            font-size: 18px;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.2s ease;
            color: #fff;
            min-width: 200px;
            margin: 6px 0;
        }
        .btn:hover { transform: scale(1.05); }
        .btn:active { transform: scale(0.95); }
        .btn-primary {
            background: linear-gradient(135deg, #00f5ff 0%, #bc13fe 100%);
            box-shadow: 0 4px 20px rgba(0, 245, 255, 0.3);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }
        .btn-danger {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a5a 100%);
            box-shadow: 0 4px 15px rgba(255, 107, 107, 0.3);
        }
        .btn-success {
            background: linear-gradient(135deg, #4ade80 0%, #16a34a 100%);
            box-shadow: 0 4px 15px rgba(74, 222, 128, 0.3);
        }
        .btn-row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            justify-content: center;
        }

        /* 玩法说明框 */
        .instructions-box {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 16px;
            font-size: 13px;
            color: #999;
            line-height: 1.8;
            max-width: 340px;
            text-align: left;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .instructions-box strong {
            color: #ccc;
            display: block;
            margin-bottom: 4px;
            font-size: 14px;
        }
        .best-score-display {
            margin-top: 10px;
            font-size: 13px;
            color: #fbbf24;
        }

        /* 暂停画面 */
        .pause-title {
            font-size: 28px;
            color: #fff;
            margin-bottom: 30px;
        }
        .pause-hint {
            color: #666;
            font-size: 12px;
            margin-top: 16px;
        }

        /* 游戏结束画面 */
        .gameover-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 16px 0 24px;
            max-width: 280px;
        }
        .go-stat {
            background: rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 10px;
        }
        .go-stat-label {
            font-size: 11px;
            color: #888;
        }
        .go-stat-value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
            margin-top: 2px;
        }

        .timer-bar {
            width: 100%; max-width: 300px; height: 6px; background: rgba(255,255,255,0.1);
            border-radius: 3px; margin-top: 12px; overflow: hidden;
        }
        .timer-fill {
            height: 100%; background: linear-gradient(90deg, #22c55e, #eab308, #ef4444);
            border-radius: 3px; transition: width 0.3s linear;
        }

        /* 响应式 */
        @media (max-height: 700px) {
            .overlay-emoji { font-size: 56px; }
            .overlay-title { font-size: 30px; }
        }
        @media (max-height: 600px) {
            .overlay-emoji { font-size: 48px; }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <div class="game-title" data-i18n="title">🕵️ 找坏人</div>
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label" data-i18n="levelLabel">关卡</div>
                <div class="hud-value" id="levelDisplay">1</div>
            </div>
            <div class="hud-item">
                <div class="hud-label" data-i18n="scoreLabel">得分</div>
                <div class="hud-value" id="scoreDisplay">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label" data-i18n="timeLabel">时间</div>
                <div class="hud-value" id="timeDisplay">30</div>
            </div>
        </div>
    </div>

    <div class="game-area">
        <div class="level-info">
            <h2 id="levelTitle">第 1 关</h2>
            <p id="levelHint">找出那个不一样的表情！</p>
        </div>
        <div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
        <div class="grid-container" id="gridContainer"></div>
    </div>

    <!-- ========== 开始画面（emoji-pattern 风格）========== -->
    <div class="overlay" id="startScreen">
        <div class="overlay-emoji">🕵️</div>
        <div class="overlay-title" data-i18n="titleText">找坏人</div>
        <div class="overlay-subtitle" data-i18n="subtitle">在一堆表情中找出唯一的不同<br>从 2×2 到 10×10，考验你的眼力！</div>
        <button class="btn btn-primary" id="startBtn" data-i18n="startGame">▶️ 开始游戏</button>
        <button class="btn btn-secondary" onclick="goBack()" data-i18n="backToArcade">🏠 回到街机厅</button>
        <div class="instructions-box">
            <strong data-i18n="howToPlay">玩法说明</strong>
            <span data-i18n="instructions">
                屏幕上满是相同的 Emoji<br>
                只有一个表情跟大家不同<br>
                点击找出那个"坏人"<br>
                点错扣 3 秒，时间归零 = 游戏结束
            </span>
        </div>
        <div class="best-score-display">
            🏆 <span data-i18n="bestLabel">历史最高</span>: <span id="startBestScore">0</span>
        </div>
    </div>

    <!-- ========== 暂停画面 ========== -->
    <div class="overlay hidden" id="pauseScreen">
        <div class="pause-title" data-i18n="gamePaused">⏸️ 游戏暂停</div>
        <div class="btn-row">
            <button class="btn btn-success" id="resumeBtn" data-i18n="resume">▶️ 继续游戏</button>
            <button class="btn btn-danger" id="restartFromPauseBtn" data-i18n="restart">🔄 重新开始</button>
        </div>
        <button class="btn btn-secondary" onclick="goBack()" data-i18n="backToArcade">🏠 回到街机厅</button>
        <div class="pause-hint" data-i18n="pauseHint">按 ESC 键也可以继续游戏</div>
    </div>

    <!-- ========== 游戏结束 ========== -->
    <div class="overlay hidden" id="gameOverScreen">
        <div class="overlay-emoji">💀</div>
        <div class="overlay-title" data-i18n="gameOver">💀 游戏结束</div>
        <div class="gameover-stats">
            <div class="go-stat"><div class="go-stat-value" id="finalLevel">1</div><div class="go-stat-label" data-i18n="levelLabel">到达关卡</div></div>
            <div class="go-stat"><div class="go-stat-value" id="finalScore">0</div><div class="go-stat-label" data-i18n="scoreLabel">最终得分</div></div>
            <div class="go-stat"><div class="go-stat-value" id="finalAccuracy">0%</div><div class="go-stat-label" data-i18n="accuracyLabel">准确率</div></div>
            <div class="go-stat"><div class="go-stat-value" id="finalBest">0</div><div class="go-stat-label" data-i18n="bestLabel">最高分</div></div>
        </div>
        <button class="btn btn-primary" id="restartBtn" data-i18n="restartGame">🔄 再来一局</button>
        <button class="btn btn-secondary" onclick="goBack()" data-i18n="backToArcade">🏠 回到街机厅</button>
    </div>

    <script src="diagnosis.js"></script>
    <script src="game.js?v=3"></script>
</body>
</html>
