<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Emoji Evolution 2048</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-user-select: none; touch-action: manipulation; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #16213e 40%, #0f0f23 100%);
            min-height: 100vh;
            color: #fff;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-header {
            width: 100%;
            max-width: 500px;
            padding: 12px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }
        .game-title { font-size: 18px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
        .hud {
            display: flex;
            gap: 12px;
            font-size: 13px;
        }
        .hud-item { text-align: center; }
        .hud-label { font-size: 10px; color: #94a3b8; }
        .hud-value { font-size: 15px; font-weight: 700; color: #fbbf24; }

        .theme-bar {
            width: 100%;
            max-width: 500px;
            padding: 8px 16px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: none;
        }
        .theme-bar::-webkit-scrollbar { display: none; }
        .theme-btn {
            flex-shrink: 0;
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .theme-btn.active {
            background: rgba(251, 191, 36, 0.2);
            border-color: #fbbf24;
            color: #fbbf24;
        }
        .theme-btn:hover { background: rgba(255,255,255,0.15); }

        .game-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px;
        }
        .grid-wrapper {
            width: 100%;
            max-width: 400px;
            aspect-ratio: 1;
            background: rgba(0,0,0,0.3);
            border-radius: 16px;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
        }
        .grid-cell {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            background: rgba(255,255,255,0.06);
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
            overflow: hidden;
        }
        .grid-cell.empty { background: rgba(255,255,255,0.03); }
        .grid-cell.new-born {
            animation: popIn 0.3s ease-out;
        }
        .grid-cell.merged {
            animation: mergePop 0.3s ease-out;
        }
        .grid-cell .level-badge {
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 9px;
            color: rgba(255,255,255,0.5);
            background: rgba(0,0,0,0.3);
            padding: 1px 4px;
            border-radius: 4px;
        }

        @keyframes popIn {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }
        @keyframes mergePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-4px); }
            75% { transform: translateX(4px); }
        }

        .controls {
            margin-top: 16px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .ctrl-btn {
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.08);
            color: #fff;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .ctrl-btn:hover { background: rgba(255,255,255,0.15); }
        .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }
        .undo-count { font-size: 11px; color: #94a3b8; margin-left: 4px; }

        .hint-text {
            margin-top: 8px;
            font-size: 12px;
            color: #64748b;
        }

        /* ========== Overlays ========== */
        .overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 8, 20, 0.92);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 30px 20px;
            text-align: center;
        }
        .overlay.show { display: flex; }

        .overlay-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .overlay-subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 24px;
        }

        /* Diagnosis Card */
        .diagnosis-card {
            background: linear-gradient(135deg, rgba(26,10,46,0.9), rgba(15,15,35,0.9));
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 24px;
            max-width: 360px;
            width: 100%;
            text-align: left;
        }
        .diagnosis-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .diagnosis-icon {
            font-size: 40px;
            line-height: 1;
        }
        .diagnosis-name {
            font-size: 20px;
            font-weight: 700;
        }
        .diagnosis-rare {
            font-size: 12px;
            margin-top: 2px;
        }
        .diagnosis-rare.legendary { color: #ff6b35; }
        .diagnosis-rare.epic { color: #a855f7; }
        .diagnosis-rare.rare { color: #3b82f6; }
        .diagnosis-rare.common { color: #94a3b8; }
        .diagnosis-quote {
            font-style: italic;
            color: #cbd5e1;
            font-size: 13px;
            margin-bottom: 12px;
            padding-left: 12px;
            border-left: 3px solid rgba(251,191,36,0.5);
        }
        .diagnosis-roast {
            background: rgba(239,68,68,0.1);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #fca5a5;
            margin-bottom: 16px;
        }
        .diagnosis-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .stat-item {
            text-align: center;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
            padding: 8px;
        }
        .stat-item.stars { grid-column: span 2; }
        .stat-label { font-size: 10px; color: #94a3b8; margin-bottom: 4px; }
        .stat-value { font-size: 15px; font-weight: 700; color: #fbbf24; }
        .diagnosis-result {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            padding: 12px;
            border-radius: 12px;
        }
        .diagnosis-result.win { background: rgba(34,197,94,0.15); color: #4ade80; }
        .diagnosis-result.lose { background: rgba(239,68,68,0.15); color: #fca5a5; }

        .overlay-buttons {
            display: flex;
            gap: 12px;
            margin-top: 20px;
        }
        .overlay-btn {
            padding: 12px 28px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
        }
        .overlay-btn.primary {
            background: linear-gradient(135deg, #fbbf24, #f59e0b);
            color: #1a0a2e;
        }
        .overlay-btn.primary:hover { transform: scale(1.05); }
        .overlay-btn.secondary {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .overlay-btn.secondary:hover { background: rgba(255,255,255,0.2); }

        /* Win celebration */
        .confetti-container {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 999;
            overflow: hidden;
        }
        .confetti-piece {
            position: absolute;
            width: 8px; height: 8px;
            animation: confetti-fall 3s ease-out forwards;
        }
        @keyframes confetti-fall {
            0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }

        /* Responsive */
        @media (max-width: 420px) {
            .grid-wrapper { max-width: 95vw; }
            .grid-cell { font-size: 28px; }
            .game-title { font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="game-header">
        <div class="game-title">
            <span>🧬</span>
            <span>Emoji Evolution 2048</span>
        </div>
        <div class="hud">
            <div class="hud-item">
                <div class="hud-label">得分</div>
                <div class="hud-value" id="score">0</div>
            </div>
            <div class="hud-item">
                <div class="hud-label">最佳</div>
                <div class="hud-value" id="best">0</div>
            </div>
        </div>
    </div>

    <div class="theme-bar" id="themeBar"></div>

    <div class="game-area">
        <div class="grid-wrapper" id="grid"></div>
        <div class="controls">
            <button class="ctrl-btn" id="undoBtn" onclick="game.undoMove()">
                ↩️ 撤销<span class="undo-count" id="undoCount">(3)</span>
            </button>
            <button class="ctrl-btn" onclick="game.restart()">🔄 重来</button>
        </div>
        <div class="hint-text">← ↑ ↓ → 或 WASD 滑动 | 相同 Emoji 合并进化</div>
    </div>

    <!-- Game Over Overlay -->
    <div class="overlay" id="gameOverOverlay">
        <div class="overlay-title">😢 进化中断</div>
        <div class="overlay-subtitle">没有可移动的空间了</div>
        <div id="diagnosisContainer"></div>
        <div class="overlay-buttons">
            <button class="overlay-btn primary" onclick="game.restart()">再来一局</button>
            <button class="overlay-btn secondary" onclick="game.goHome()">返回首页</button>
        </div>
    </div>

    <!-- Win Overlay -->
    <div class="overlay" id="winOverlay">
        <div class="overlay-title">🎉 进化完成！</div>
        <div class="overlay-subtitle">你合成了终极形态！</div>
        <div id="winDiagnosisContainer"></div>
        <div class="overlay-buttons">
            <button class="overlay-btn primary" onclick="game.restart()">再来一局</button>
            <button class="overlay-btn secondary" onclick="game.goHome()">返回首页</button>
        </div>
    </div>

    <div class="confetti-container" id="confetti"></div>

    <script src="themes.js"></script>
    <script src="game.js"></script>
    <script src="diagnosis.js"></script>
    <script src="../../shared/stars-system.js"></script>
    <script>
        class EmojiEvolveUI {
            constructor() {
                this.game = null;
                this.currentTheme = 'life';
                this.init();
            }

            init() {
                this.renderThemeBar();
                this.startGame('life');
                this.setupControls();
                this.setupTouch();
            }

            renderThemeBar() {
                const bar = document.getElementById('themeBar');
                bar.innerHTML = '';
                Object.values(THEMES).forEach(theme => {
                    const btn = document.createElement('button');
                    btn.className = 'theme-btn' + (theme.id === this.currentTheme ? ' active' : '');
                    btn.innerHTML = `${theme.emoji} ${theme.name}`;
                    btn.onclick = () => this.switchTheme(theme.id);
                    bar.appendChild(btn);
                });
            }

            switchTheme(themeId) {
                this.currentTheme = themeId;
                this.renderThemeBar();
                this.startGame(themeId);
            }

            startGame(themeId) {
                this.game = new EmojiEvolveGame({ theme: themeId });
                this.updateUI();
                this.renderGrid();
                this.hideOverlays();
            }

            restart() {
                this.startGame(this.currentTheme);
            }

            goHome() {
                window.location.href = '../../index.html';
            }

            undoMove() {
                if (this.game.undo()) {
                    this.updateUI();
                    this.renderGrid();
                }
            }

            updateUI() {
                document.getElementById('score').textContent = this.game.score;
                document.getElementById('best').textContent = this.game.getBestScore();
                document.getElementById('undoCount').textContent = `(${this.game.undoCount})`;
                document.getElementById('undoBtn').disabled = this.game.undoCount <= 0;
            }

            renderGrid() {
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                const theme = getTheme(this.currentTheme);

                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const level = this.game.board[r][c];
                        const cell = document.createElement('div');
                        cell.className = 'grid-cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;

                        if (level === 0) {
                            cell.classList.add('empty');
                        } else {
                            const item = getChainItem(this.currentTheme, level);
                            const color = getColor(this.currentTheme, level);
                            cell.style.background = `linear-gradient(135deg, ${color}44, ${color}22)`;
                            cell.style.boxShadow = `0 0 12px ${color}33`;
                            cell.innerHTML = `${item.emoji}<span class="level-badge">Lv.${level}</span>`;

                            // 动画标记
                            if (this.game.newCells.some(p => p.r === r && p.c === c)) {
                                cell.classList.add('new-born');
                            }
                        }
                        grid.appendChild(cell);
                    }
                }

                // 清除动画标记（下次渲染不再应用）
                this.game.newCells = [];
                this.game.mergeCells = [];
            }

            move(direction) {
                if (!this.game || this.game.gameOver || this.game.won) return;
                const moved = this.game.move(direction);
                if (moved) {
                    this.updateUI();
                    this.renderGrid();

                    if (this.game.won) {
                        setTimeout(() => this.showWin(), 400);
                    } else if (this.game.gameOver) {
                        setTimeout(() => this.showGameOver(), 400);
                    }
                }
            }

            showGameOver() {
                const diag = EvolveDiagnosis.generate(this.game.getDiagnosisData());
                document.getElementById('diagnosisContainer').innerHTML = EvolveDiagnosis.render(diag);
                document.getElementById('gameOverOverlay').classList.add('show');
                this.awardStars(diag.data.stars);
            }

            showWin() {
                this.spawnConfetti();
                const diag = EvolveDiagnosis.generate(this.game.getDiagnosisData());
                document.getElementById('winDiagnosisContainer').innerHTML = EvolveDiagnosis.render(diag);
                document.getElementById('winOverlay').classList.add('show');
                this.awardStars(diag.data.stars);
            }

            awardStars(stars) {
                if (typeof ArcadeStars !== 'undefined') {
                    ArcadeStars.addStars(stars, 'emoji-evolve');
                }
            }

            spawnConfetti() {
                const container = document.getElementById('confetti');
                container.innerHTML = '';
                const colors = ['#fbbf24', '#f59e0b', '#ef4444', '#3b82f6', '#22c55e', '#a855f7'];
                for (let i = 0; i < 60; i++) {
                    const piece = document.createElement('div');
                    piece.className = 'confetti-piece';
                    piece.style.left = Math.random() * 100 + '%';
                    piece.style.background = colors[Math.floor(Math.random() * colors.length)];
                    piece.style.animationDelay = Math.random() * 2 + 's';
                    piece.style.animationDuration = (2 + Math.random() * 2) + 's';
                    container.appendChild(piece);
                }
                setTimeout(() => container.innerHTML = '', 5000);
            }

            hideOverlays() {
                document.getElementById('gameOverOverlay').classList.remove('show');
                document.getElementById('winOverlay').classList.remove('show');
                document.getElementById('confetti').innerHTML = '';
            }

            setupControls() {
                document.addEventListener('keydown', (e) => {
                    const keyMap = {
                        'ArrowUp': 'up', 'ArrowDown': 'down', 'ArrowLeft': 'left', 'ArrowRight': 'right',
                        'w': 'up', 'W': 'up',
                        's': 'down', 'S': 'down',
                        'a': 'left', 'A': 'left',
                        'd': 'right', 'D': 'right'
                    };
                    if (keyMap[e.key]) {
                        e.preventDefault();
                        this.move(keyMap[e.key]);
                    }
                });
            }

            setupTouch() {
                let startX, startY;
                const grid = document.getElementById('grid');
                const threshold = 30;

                grid.addEventListener('touchstart', (e) => {
                    startX = e.touches[0].clientX;
                    startY = e.touches[0].clientY;
                }, { passive: true });

                grid.addEventListener('touchend', (e) => {
                    if (!startX || !startY) return;
                    const dx = e.changedTouches[0].clientX - startX;
                    const dy = e.changedTouches[0].clientY - startY;
                    if (Math.abs(dx) < threshold && Math.abs(dy) < threshold) return;

                    if (Math.abs(dx) > Math.abs(dy)) {
                        this.move(dx > 0 ? 'right' : 'left');
                    } else {
                        this.move(dy > 0 ? 'down' : 'up');
                    }
                    startX = null;
                    startY = null;
                }, { passive: true });
            }
        }

        const game = new EmojiEvolveUI();
    </script>
</body>
</html>
